name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only PostgreSQL is required. The suites for Redis, MongoDB and object storage
      # skip themselves when their TEST_* variables are empty.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexa_test
      # The Prisma CLI reads this even when only generating.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexa_test
      DATABASE_SSL: 'false'

    steps:
      - uses: actions/checkout@v7

      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generated Prisma client is not in the repository.
      - run: pnpm --filter @nexa/api db:generate

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  local-setup:
    name: Run it on your machine
    runs-on: ubuntu-latest
    concurrency:
      group: local-setup-${{ github.ref }}
      cancel-in-progress: true

    # The steps of "Run it on your machine" in the README, in the same order, so that anyone
    # without access to the shared databases can still start NEXA from a fresh clone.
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: docker compose up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: cp apps/api/.env.local.example apps/api/.env
      - run: pnpm --filter @nexa/api db:generate
      - run: pnpm --filter @nexa/api db:deploy
      - run: pnpm --filter @nexa/api seed:demo -- --org nexa --create --name NEXA --yes

      - name: Start the API and walk through it
        run: |
          pnpm --filter @nexa/api build
          (cd apps/api && node dist/server.js > ../../api.log 2>&1 &)
          node scripts/smoke-test.mjs http://localhost:4000 || { cat api.log; exit 1; }

  deploy:
    name: Deploy to the VPS
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # No checkout: the server pulls the commit itself. The key may only run
      # scripts/deploy.sh (forced command in authorized_keys), so this cannot
      # turn into shell access on the VPS if the secret ever leaks.
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
